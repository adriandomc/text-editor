<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rich Text Editor</title>
  <script src="rich-buttons.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Rich Text Editor (WIP)</h1>
  <a href="https://github.com/adriandomc/text-editor" target="_blank">Github</a>
  <div class="texto" id="editor" contenteditable="true">    
  </div>
  <div class="botonera">
    <button class="boton" id="left" title="Alinear a la izquierda" onclick="formatParagraph(this.id)">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-align-left-icon lucide-align-left">
        <path d="M15 12H3" />
        <path d="M17 18H3" />
        <path d="M21 6H3" />
      </svg>
    </button>
    <button class="boton" id="center" title="Alinear al centro" onclick="formatParagraph(this.id)">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-align-center-icon lucide-align-center">
        <path d="M17 12H7" />
        <path d="M19 18H5" />
        <path d="M21 6H3" />
      </svg>
    </button>
    <button class="boton" id="right" title="Alinear a la derecha" onclick="formatParagraph(this.id)">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-align-right-icon lucide-align-right">
        <path d="M21 12H9" />
        <path d="M21 18H7" />
        <path d="M21 6H3" />
      </svg>
    </button>
    <button class="boton" id="justify" title="Justificar" onclick="formatParagraph(this.id)">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-align-justify-icon lucide-align-justify">
        <path d="M3 12h18" />
        <path d="M3 18h18" />
        <path d="M3 6h18" />
      </svg>
    </button>
    <div class="botones-encabezados">
      <button class="boton" id="header" title="Encabezado" onclick="showHeaders()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-heading-icon lucide-heading">
          <path d="M6 12h12" />
          <path d="M6 20V4" />
          <path d="M18 20V4" />
        </svg>
        <path d="M3 12h18" />
        <path d="M3 18h18" />
        <path d="M3 6h18" />
        </svg>
      </button>
      <div id="menu-encabezados">
        <button class="boton" id="h1" title="Encabezado 1" onclick="formatHeading(this.id)">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-heading1-icon lucide-heading-1">
            <path d="M4 12h8" />
            <path d="M4 18V6" />
            <path d="M12 18V6" />
            <path d="m17 12 3-2v8" />
          </svg>
        </button>
        <button class="boton" id="h2" title="Encabezado 2" onclick="formatHeading(this.id)">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-heading2-icon lucide-heading-2">
            <path d="M4 12h8" />
            <path d="M4 18V6" />
            <path d="M12 18V6" />
            <path d="M21 18h-4c0-4 4-3 4-6 0-1.5-2-2.5-4-1" />
          </svg>
        </button>
        <button class="boton" id="h3" title="Encabezado 3" onclick="formatHeading(this.id)">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-heading3-icon lucide-heading-3">
            <path d="M4 12h8" />
            <path d="M4 18V6" />
            <path d="M12 18V6" />
            <path d="M17.5 10.5c1.7-1 3.5 0 3.5 1.5a2 2 0 0 1-2 2" />
            <path d="M17 17.5c2 1.5 4 .3 4-1.5a2 2 0 0 0-2-2" />
          </svg>
        </button>
        <button class="boton" id="h4" title="Encabezado 4" onclick="formatHeading(this.id)">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-heading4-icon lucide-heading-4">
            <path d="M12 18V6" />
            <path d="M17 10v3a1 1 0 0 0 1 1h3" />
            <path d="M21 10v8" />
            <path d="M4 12h8" />
            <path d="M4 18V6" />
          </svg>
        </button>
        <button class="boton" id="h5" title="Encabezado 5" onclick="formatHeading(this.id)">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-heading5-icon lucide-heading-5">
            <path d="M4 12h8" />
            <path d="M4 18V6" />
            <path d="M12 18V6" />
            <path d="M17 13v-3h4" />
            <path d="M17 17.7c.4.2.8.3 1.3.3 1.5 0 2.7-1.1 2.7-2.5S19.8 13 18.3 13H17" />
          </svg>
        </button>
        <button class="boton" id="h6" title="Encabezado 6" onclick="formatHeading(this.id)">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-heading6-icon lucide-heading-6">
            <path d="M4 12h8" />
            <path d="M4 18V6" />
            <path d="M12 18V6" />
            <circle cx="19" cy="16" r="2" />
            <path d="M20 10c-2 2-3 3.5-3 6" />
          </svg>
        </button>
      </div>
    </div>
    <button class="boton" id="bold" title="Bold" onclick="applyStyle('bold')">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-bold-icon lucide-bold">
        <path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8" />
      </svg>
    </button>
    <button class="boton" id="italic" title="Italic" onclick="applyStyle('italic')">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-italic-icon lucide-italic">
        <line x1="19" x2="10" y1="4" y2="4" />
        <line x1="14" x2="5" y1="20" y2="20" />
        <line x1="15" x2="9" y1="4" y2="20" />
      </svg>
    </button>
    <button class="boton" id="underline" title="Underline" onclick="applyStyle('underline')">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-underline-icon lucide-underline">
        <path d="M6 4v6a6 6 0 0 0 12 0V4" />
        <line x1="4" x2="20" y1="20" y2="20" />
      </svg>
    </button>
  </div>
  <div class="debug-log">
  </div>
  <script>
    //------------------------------- V I S U A L S ---------------------------------- 

    function showHeaders() {
      const element = document.getElementById('menu-encabezados');

      if (headerToggle) {
        element.style.display = 'none';
      } else {
        element.style.display = 'flex';
      }

      headerToggle = !headerToggle;
    }
  </script>
</body>

</html>
